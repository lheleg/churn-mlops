version: 0.2

# CI build spec run by AWS CodeBuild (referenced by the CodePipeline Build stage).

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt
  pre_build:
    commands:
      - aws s3 cp s3://$DATA_BUCKET/data/raw/telco_churn.csv data/raw/telco_churn.csv
  build:
    commands:
      - pytest -v
